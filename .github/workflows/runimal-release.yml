name: Runimal Release

on:
  workflow_dispatch:
    inputs:
      archive_release:
        description: Archive and export an IPA after validation
        required: false
        type: boolean
        default: false
      upload_to_testflight:
        description: Upload the exported IPA to TestFlight
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Ensure XcodeGen is available
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Run core tests
        run: swift test

      - name: Build unsigned iPhone validation target
        run: xcodebuild -project RunimalApple.xcodeproj -scheme RunimalPhone -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

      - name: Build unsigned Watch validation target
        run: xcodebuild -project RunimalApple.xcodeproj -scheme RunimalWatch -destination 'generic/platform=watchOS' CODE_SIGNING_ALLOWED=NO build

  release:
    if: github.event_name == 'workflow_dispatch' && (inputs.archive_release || inputs.upload_to_testflight)
    runs-on: macos-15
    needs: validate
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Ensure XcodeGen is available
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Evaluate release inputs and secrets
        id: release_preflight
        run: |
          wants_archive="${{ inputs.archive_release || inputs.upload_to_testflight }}"
          wants_upload="${{ inputs.upload_to_testflight }}"
          has_team_id=false
          has_upload_secrets=false

          if [[ -n "${TEAM_ID}" ]]; then
            has_team_id=true
          fi

          if [[ -n "${ASC_KEY_ID}" && -n "${ASC_ISSUER_ID}" && -n "${ASC_PRIVATE_KEY_BASE64}" ]]; then
            has_upload_secrets=true
          fi

          echo "wants_archive=${wants_archive}" >> "$GITHUB_OUTPUT"
          echo "wants_upload=${wants_upload}" >> "$GITHUB_OUTPUT"
          echo "has_team_id=${has_team_id}" >> "$GITHUB_OUTPUT"
          echo "has_upload_secrets=${has_upload_secrets}" >> "$GITHUB_OUTPUT"

      - name: Guard archive request without team secret
        if: steps.release_preflight.outputs.wants_archive == 'true' && steps.release_preflight.outputs.has_team_id != 'true'
        run: |
          echo "DEVELOPMENT_TEAM_ID secret is required for archive/export." >&2
          exit 1

      - name: Guard upload request without App Store Connect secrets
        if: steps.release_preflight.outputs.wants_upload == 'true' && steps.release_preflight.outputs.has_upload_secrets != 'true'
        run: |
          echo "ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY_BASE64 secrets are required for TestFlight upload." >&2
          exit 1

      - name: Archive and export Release IPA
        if: steps.release_preflight.outputs.wants_archive == 'true' && steps.release_preflight.outputs.has_team_id == 'true'
        env:
          TEAM_ID: ${{ env.TEAM_ID }}
        run: ./scripts/release/testflight_archive.sh

      - name: Upload exported IPA to workflow artifacts
        if: steps.release_preflight.outputs.wants_archive == 'true' && steps.release_preflight.outputs.has_team_id == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runimal-release-ipa
          path: build/release/export/RunimalPhone.ipa
          if-no-files-found: error

      - name: Upload IPA to TestFlight
        if: steps.release_preflight.outputs.wants_upload == 'true' && steps.release_preflight.outputs.has_upload_secrets == 'true'
        env:
          ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ env.ASC_PRIVATE_KEY_BASE64 }}
        run: ./scripts/release/upload_to_testflight.sh
