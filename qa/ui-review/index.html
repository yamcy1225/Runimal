<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runimal UI Review Board</title>
    <style>
      :root {
        --bg: #f5f1e8;
        --surface: rgba(255, 252, 246, 0.9);
        --ink: #1b1d19;
        --muted: #6e7269;
        --line: rgba(27, 29, 25, 0.12);
        --accent: #27785b;
        --accent-soft: rgba(39, 120, 91, 0.14);
        --warn: #b85a30;
        --shadow: 0 24px 64px rgba(18, 27, 24, 0.12);
        --capture-scale: 1;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "SF Mono", "IBM Plex Mono", Menlo, monospace;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(39, 120, 91, 0.18), transparent 32%),
          radial-gradient(circle at top right, rgba(184, 90, 48, 0.12), transparent 28%),
          linear-gradient(180deg, #faf7ef 0%, #f0eadc 100%);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(16px);
        background: rgba(250, 247, 239, 0.86);
        border-bottom: 1px solid var(--line);
      }
      .shell {
        width: min(1480px, calc(100vw - 32px));
        margin: 0 auto;
      }
      .hero {
        display: grid;
        gap: 20px;
        padding: 20px 0 18px;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      }
      .hero-copy h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 42px);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }
      .hero-copy p,
      .panel p,
      .capture-meta,
      .notes textarea,
      .empty-state {
        color: var(--muted);
        line-height: 1.55;
      }
      .toolbar,
      .panel,
      .capture-card,
      .device-frame {
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 14px;
        border-radius: 18px;
      }
      .segment {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .segment-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }
      button {
        border: 1px solid var(--line);
        background: white;
        color: var(--ink);
        border-radius: 999px;
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
        transition: 160ms ease;
      }
      button.active {
        background: var(--ink);
        color: white;
        border-color: var(--ink);
      }
      button:hover { transform: translateY(-1px); }
      main { padding: 26px 0 40px; }
      .board { display: grid; gap: 18px; }
      .capture-card {
        border-radius: 22px;
        padding: 18px;
        display: grid;
        gap: 18px;
      }
      .capture-card[data-missing="true"] { border-color: rgba(184, 90, 48, 0.3); }
      .capture-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .capture-header h2 {
        margin: 10px 0 6px;
        font-size: clamp(22px, 3vw, 30px);
      }
      .capture-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        align-items: start;
      }
      .device-frame {
        border-radius: 18px;
        overflow: hidden;
      }
      .frame-label {
        padding: 10px 12px;
        background: rgba(27, 29, 25, 0.04);
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
      }
      .capture-stage {
        aspect-ratio: 0.55;
        display: grid;
        place-items: center;
        padding: 16px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(243, 236, 221, 0.92)),
          repeating-linear-gradient(0deg, rgba(27, 29, 25, 0.035), rgba(27, 29, 25, 0.035) 1px, transparent 1px, transparent 18px);
      }
      .capture-stage img {
        width: calc(100% * var(--capture-scale));
        max-width: 100%;
        border-radius: 20px;
        border: 1px solid rgba(27, 29, 25, 0.08);
        background: white;
      }
      .empty-state {
        text-align: center;
        padding: 24px;
        border: 1px dashed rgba(184, 90, 48, 0.42);
        border-radius: 18px;
        background: rgba(184, 90, 48, 0.05);
      }
      .notes {
        display: grid;
        gap: 10px;
      }
      .notes textarea {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        border-radius: 16px;
        border: 1px solid var(--line);
        padding: 12px 14px;
        background: white;
        font: inherit;
      }
      .report-panel {
        border-radius: 18px;
        padding: 16px;
      }
      .report-panel ul {
        margin: 10px 0 0;
        padding-left: 20px;
        color: var(--muted);
      }
      @media (max-width: 960px) {
        .hero { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="shell hero">
        <div class="hero-copy">
          <div class="eyebrow">Runimal UI Review</div>
          <h1>The run I completed becomes life.</h1>
          <p>
            This board compares the latest native captures by platform and flow so spacing,
            safe areas, truncation, and premium-feeling reward moments can be reviewed in one place.
          </p>
        </div>
        <div class="toolbar">
          <div class="segment">
            <span class="segment-label">Platform</span>
            <button class="platform-filter active" data-platform="All">All</button>
            <button class="platform-filter" data-platform="iPhone">iPhone</button>
            <button class="platform-filter" data-platform="Apple Watch">Apple Watch</button>
            <button class="platform-filter" data-platform="macOS">macOS</button>
          </div>
          <div class="segment">
            <span class="segment-label">View</span>
            <button class="view-filter active" data-view="split">Current + Revised</button>
            <button class="view-filter" data-view="current">Current only</button>
            <button class="view-filter" data-view="revised">Revised only</button>
          </div>
          <div class="segment">
            <span class="segment-label">Scale</span>
            <button class="scale-filter active" data-scale="1">100%</button>
            <button class="scale-filter" data-scale="0.9">90%</button>
            <button class="scale-filter" data-scale="0.8">80%</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="shell board" id="board"></div>
    </main>

    <script>
      const state = { platform: 'All', view: 'split', scale: 1 };
      const board = document.getElementById('board');

      async function loadManifest() {
        const response = await fetch('./manifest.json');
        return response.json();
      }

      function setButtonState(selector, value, attr) {
        document.querySelectorAll(selector).forEach((button) => {
          button.classList.toggle('active', button.dataset[attr] === String(value));
        });
      }

      function renderCapture(label, path) {
        if (!path) {
          return `<div class="device-frame"><div class="frame-label"><span>${label}</span><span>missing</span></div><div class="capture-stage"><div class="empty-state">No capture path configured.</div></div></div>`;
        }

        return `
          <div class="device-frame">
            <div class="frame-label"><span>${label}</span><span>${path.split('/').pop()}</span></div>
            <div class="capture-stage">
              <img src="${path}" alt="${label}" onerror="this.replaceWith(Object.assign(document.createElement('div'), { className: 'empty-state', textContent: 'Capture missing: ${path}' }))" />
            </div>
          </div>
        `;
      }

      function renderBoard(manifest) {
        document.documentElement.style.setProperty('--capture-scale', state.scale);
        const screens = manifest.screens.filter((screen) => state.platform === 'All' || screen.platform === state.platform);

        board.innerHTML = screens.map((screen) => {
          const showCurrent = state.view === 'split' || state.view === 'current';
          const showRevised = state.view === 'split' || state.view === 'revised';
          const missing = !screen.current || !screen.revised;

          return `
            <section class="capture-card" data-missing="${missing}">
              <div class="capture-header">
                <div>
                  <div class="eyebrow">${screen.platform}</div>
                  <h2>${screen.flow}</h2>
                  <div class="capture-meta">${screen.id}</div>
                </div>
                <div class="report-panel panel">
                  <strong>Review Prompt</strong>
                  <ul>
                    <li>No clipping</li>
                    <li>No CTA ambiguity</li>
                    <li>Premium reward read</li>
                  </ul>
                </div>
              </div>
              <div class="capture-grid">
                ${showCurrent ? renderCapture('Current', screen.current) : ''}
                ${showRevised ? renderCapture('Revised', screen.revised) : ''}
                <div class="panel notes">
                  <strong>Reviewer Notes</strong>
                  <p>${screen.notes}</p>
                  <textarea placeholder="Add readability, spacing, and safe-area findings here."></textarea>
                </div>
              </div>
            </section>
          `;
        }).join('');
      }

      document.addEventListener('click', (event) => {
        const platformButton = event.target.closest('.platform-filter');
        const viewButton = event.target.closest('.view-filter');
        const scaleButton = event.target.closest('.scale-filter');

        if (platformButton) {
          state.platform = platformButton.dataset.platform;
          setButtonState('.platform-filter', state.platform, 'platform');
          renderBoard(window.reviewManifest);
        }
        if (viewButton) {
          state.view = viewButton.dataset.view;
          setButtonState('.view-filter', state.view, 'view');
          renderBoard(window.reviewManifest);
        }
        if (scaleButton) {
          state.scale = Number(scaleButton.dataset.scale);
          setButtonState('.scale-filter', state.scale, 'scale');
          renderBoard(window.reviewManifest);
        }
      });

      loadManifest().then((manifest) => {
        window.reviewManifest = manifest;
        renderBoard(manifest);
      });
    </script>
  </body>
</html>
